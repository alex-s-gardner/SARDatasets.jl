name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  bridge:
    name: Geometry bridge - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['lts', '1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: alex-s-gardner/FastGeoProjections.jl
          ref: main
          path: deps/FastGeoProjections.jl
      - uses: actions/checkout@v6
        with:
          repository: alex-s-gardner/ImagePairGeometry.jl
          ref: main
          path: deps/ImagePairGeometry.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # The bridge is an extension over ImagePairGeometry, which itself needs FastGeoProjections from
      # `main` — its registered version predates the point-operator API. Neither resolves from a
      # registry, which forces three things:
      #
      # `Pkg.develop` by path rather than `Pkg.add` by URL, because `Pkg.add` promotes
      # ImagePairGeometry out of `[weakdeps]` into `[deps]` and deletes the `[weakdeps]` block, which
      # silently stops the extension from loading at all.
      #
      # The test environment rather than the package environment, for the same reason: developing into
      # the package environment rewrites `Project.toml`.
      #
      # `include("test/runtests.jl")` rather than `Pkg.test`, because Julia 1.10 fails with
      # `can not merge projects` when it merges an environment holding a path-sourced package that the
      # package environment also names.
      - name: Run the suite with the geometry packages
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.activate("test")
          Pkg.develop([Pkg.PackageSpec(path = "deps/FastGeoProjections.jl"),
                       Pkg.PackageSpec(path = "deps/ImagePairGeometry.jl"),
                       Pkg.PackageSpec(path = ".")])
          Pkg.instantiate()
          include(joinpath(pwd(), "test", "runtests.jl"))
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using SARDatasets
          DocMeta.setdocmeta!(SARDatasets, :DocTestSetup, :(using SARDatasets); recursive=true)
          doctest(SARDatasets)
